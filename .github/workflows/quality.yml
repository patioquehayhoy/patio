name: Calidad de Patio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Ensayar RLS y transacciones sobre datos aislados
        run: |
          npm install --prefix "$RUNNER_TEMP/patio-sql" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          node scripts/db-tests/run-pglite.cjs "$RUNNER_TEMP/patio-sql"
      - name: Preparar fuentes libres para comprobar la exportación
        run: |
          mkdir -p assets/fonts/prueba
          cp node_modules/@expo-google-fonts/plus-jakarta-sans/800ExtraBold/PlusJakartaSans_800ExtraBold.ttf assets/fonts/prueba/Monument-Black.otf
          cp node_modules/@expo-google-fonts/plus-jakarta-sans/400Regular/PlusJakartaSans_400Regular.ttf assets/fonts/prueba/NeueMontreal-Regular.otf
          cp node_modules/@expo-google-fonts/plus-jakarta-sans/600SemiBold/PlusJakartaSans_600SemiBold.ttf assets/fonts/prueba/NeueMontreal-Semibold.otf
          echo '::warning::Exportación de CI con fuentes sustitutas libres: no valida tipografía ni licencias del candidato.'
      - name: Exportar JavaScript de iOS y Android con fuentes de prueba CI
        run: npx expo export --platform ios --platform android --output-dir dist
      - name: Registrar auditoría de dependencias
        # Remains failing while advisories are unresolved; never use --force
        # to upgrade the Expo SDK just to make this job green.
        run: npm audit --audit-level=high
