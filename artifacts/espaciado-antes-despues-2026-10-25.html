<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Espaciado antes y después</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEFEB;font-family:-apple-system,system-ui,sans-serif;color:#111214}
main{max-width:880px;margin:0 auto;padding:40px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col{background:#F8F8F5;border-radius:28px;padding:28px 22px}
.tag{margin:0 0 18px;font:600 12px -apple-system,system-ui;color:#4A4A47}
.b{font-family:'Plus Jakarta Sans';font-weight:800;margin:0}
.lab{margin:0;font:700 11px/14px -apple-system,system-ui;text-transform:uppercase;color:#4A4A47}
.sf{margin:0;font:600 17px/22px -apple-system,system-ui}
p.t{margin:8px 0 0;font:400 15px/22px -apple-system,system-ui;color:#4A4A47}
</style></head><body><main>
<div class="grid">
<div class="col"><p class="tag">Antes</p>
<p class="lab" style="letter-spacing:1.6px">Cerca de ti</p>
<p class="b" style="font-size:40px;line-height:42px;letter-spacing:-1.2px;margin-top:8px">Saber qué hay hoy.</p>
<p class="b" style="font-size:34px;line-height:38px;letter-spacing:-1px;margin-top:22px">Explorar</p>
<p class="b" style="font-size:34px;line-height:38px;letter-spacing:-1px;margin-top:14px">Fonda Doña Rosa</p>
<p class="sf" style="letter-spacing:-0.18px;margin-top:16px">Chile relleno de queso</p>
<p class="t">Qué hicieron, en cuánto y qué tan lejos queda.</p></div>
<div class="col"><p class="tag">Después</p>
<p class="lab" style="letter-spacing:.8px">Cerca de ti</p>
<p class="b" style="font-size:40px;line-height:44px;letter-spacing:-.4px;margin-top:8px">Saber qué hay hoy.</p>
<p class="b" style="font-size:34px;line-height:38px;letter-spacing:-.34px;margin-top:22px">Explorar</p>
<p class="b" style="font-size:34px;line-height:38px;letter-spacing:-.34px;margin-top:14px">Fonda Doña Rosa</p>
<p class="sf" style="margin-top:16px">Chile relleno de queso</p>
<p class="t">Qué hicieron, en cuánto y qué tan lejos queda.</p></div>
</div></main></body></html>
