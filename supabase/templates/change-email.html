<!--
  Patio — Template de email "Magic Link"
  ───────────────────────────────────────────────────────────────────────────
  DÓNDE SE PEGA: Supabase Dashboard → Authentication → Email Templates → "Magic Link"
  (y replicarlo en "Confirm signup" — signInWithOtp con shouldCreateUser:true
   manda el de signup la primera vez; el repo solo confirma signInWithOtp,
   no hay reset de password ni cambio de correo en la app, así que este es
   el único correo real que Patio dispara).

  Variables de Supabase usadas:
    {{ .ConfirmationURL }}  → enlace que abre patio://login-callback con el token
    {{ .Email }}            → correo del destinatario

  Rediseño 2026-07-24 v3 — dos rondas de feedback de Alejandro:
  v2 arregló logo/pesos/CTA centrado pero seguía "con mucha info" y el bloque
  de copiar-y-pegar-en-el-navegador metía fricción sin aportar ("qué onda con
  eso"). v3:
  - Se cortó el párrafo explicativo del botón: el cuerpo ahora es una sola
    línea ("Válido los próximos 15 minutos"), no dos.
  - Se eliminó por completo el bloque de URL cruda para copiar/pegar. No
    resuelve nada que el botón no resuelva (ambos abren el mismo enlace) y
    era exactamente lo que se leía "como código". Si el botón falla, la
    salida ahora es humana: escribir a soporte, no pegar un link tokenizado.
  - Se dejó de centrar TODO: logo/título/CTA/firma siguen centrados (el
    momento hero), pero el texto utilitario (seguridad, soporte, legal)
    volvió a alineación izquierda — así se lee la mayoría del correo
    transaccional real, un párrafo largo centrado es más difícil de leer.
  - Repaso de viudas: cada línea de copy lleva &nbsp; entre sus últimas dos
    palabras (ley CLAUDE.md, sin excepción para email aunque no haya noWidow
    disponible aquí).
  - Logo real: wordmark oficial (assets/images/logo-negro.png) embebido como
    data URI — no hay hosting público del asset todavía, así que no se puede
    usar una URL remota; data URI renderiza nativo en Apple Mail/iOS (el
    cliente principal del usuario). Si algún día se sube el logo a un bucket
    público de Supabase Storage, cambiar a <img src="https://.../logo-negro.png">
    es más robusto entre clientes (Outlook desktop no siempre soporta data URI).
  - Paleta vigente (CLAUDE.md, corregida 2026-07-22): BG #EFEFEF, BLACK #292929,
    WHITE #FFFFFF, hairline rgba(0,0,0,0.08). Accent naranja #F2612F sin cambio.
  - Tipografía: system-ui (Plus Jakarta / Fonts.brand no se puede cargar de forma
    confiable en clientes de correo — Gmail ignora @font-face).
  - HTML de email: maquetado con <table>, estilos inline. NADA de flexbox/grid:
    los clientes (Gmail, Apple Mail, Outlook) los ignoran.
  - Copy regido por IDENTITY_VERBAL: humano, local, sin "fonda/fondero" paraguas,
    sin lenguaje comparativo.
-->
