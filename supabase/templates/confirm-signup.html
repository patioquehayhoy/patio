<html>
<head>
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
</head>
<body style="margin:0;background:#F3F3F0;padding:28px 16px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#1C1C1E;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center">
        <table width="420" cellpadding="0" cellspacing="0" role="presentation" style="width:420px;max-width:100%;background:#FFFFFF;border-radius:30px;border:1px solid #E7E7E2;box-shadow:0 12px 34px rgba(28,28,30,0.05);">

          <tr>
            <td align="center" style="padding:50px 32px 0 32px;">
              <img src="https://gjfjsjlrgycrgmcbjrus.supabase.co/storage/v1/object/public/Patio%20ID/logo-negro.png" width="176" alt="Patio" style="display:block;border:0;" />
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:34px 32px 0 32px;">
              <div style="font-size:32px;line-height:1.04;font-weight:700;letter-spacing:-0.8px;color:#1C1C1E;">
                Accede a tu cuenta
              </div>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:14px 32px 0 32px;">
              <div style="max-width:320px;font-size:16px;line-height:1.35;font-weight:400;color:#6E6E73;">
                Escribe este código en Patio o abre el enlace de abajo.
              </div>
            </td>
          </tr>

          <tr><td align="center" style="padding:24px 32px 0;font-size:32px;font-weight:700;letter-spacing:6px;">{{ .Token }}</td></tr>

          <tr>
            <td align="center" style="padding:30px 32px 0 32px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;min-width:260px;background:#1C1C1E;color:#FFFFFF;text-decoration:none;text-align:center;padding:18px 28px;border-radius:18px;font-size:16px;line-height:1;font-weight:600;">
                Abrir Patio
              </a>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:28px 32px 40px 32px;">
              <div style="max-width:320px;font-size:11px;line-height:1.35;color:rgba(110,110,115,0.72);">
                Si no solicitaste este correo, puedes ignorarlo.
              </div>
              <div style="padding-top:4px;font-size:11px;line-height:1.35;color:rgba(110,110,115,0.72);">
                Si tienes algún problema, escribe a
                <a href="mailto:quehayhoy.patio@gmail.com" style="color:rgba(110,110,115,0.88);text-decoration:underline;">quehayhoy.patio@gmail.com</a>.
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
